<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <!-- @head -->
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <!-- @render masthead -->

    <main id="main">
      <section class="page-head" aria-labelledby="h1">
        <div class="wrap page-head__in page-head__in--one">
          <div>
            <h1 id="h1" class="page-head__h">See it&nbsp;working.</h1>
            <p class="lede">Real screens from the app, on a sample business. <span class="tag tag--plain">made-up data</span></p>
          </div>
        </div>
      </section>

      <section class="section tour" aria-label="Six screens">
        <div class="wrap">
          <ol class="tour__list">
            <li class="tour__item">
              <figure class="shot">
                <img src="/media/shot-office-sales.webp" width="1200" height="515" loading="lazy" decoding="async"
                  alt="The office: people at desks in coloured zones, Sales between Analytics and the cafeteria, a dog on the floor." />
                <figcaption>Your team, at their desks. Sales has one now.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot shot--card">
                <img src="/media/shot-answer.webp" width="760" height="782" loading="lazy" decoding="async"
                  alt="The answer to 'Why did sign-ups drop this week, and what should we do?': the new phone-number box crashes the sign-up screen, with a small source tag on every claim." />
                <figcaption>Ask why. Every claim shows its source.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot">
                <img src="/media/shot-brain.webp" width="1000" height="898" loading="lazy" decoding="async"
                  alt="'What your team knows': a sentence on how much the team knows and from how many sources, a search box, recent decisions and what comes up most." />
                <figcaption>The company brain, in plain words.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot shot--card">
                <img src="/media/shot-tools.webp" width="900" height="1000" loading="lazy" decoding="async"
                  alt="Your tools: Gmail, Google Calendar and Google Analytics, each with a line on what the team does with it and a Connect button." />
                <figcaption>Connect the tools you use. Reading first, then your OK.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot shot--card">
                <img src="/media/shot-email-times.webp" width="720" height="894" loading="lazy" decoding="async"
                  alt="A drafted reply to a new enquiry with three free times, Monday 19, Tuesday 20 and Wednesday 21 October, and Approve, Change and No thanks buttons." />
                <figcaption>A reply with three real times, waiting for your OK.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot shot--card">
                <img src="/img/tour-plan-card-700.webp" srcset="/img/tour-plan-card-420.webp 420w, /img/tour-plan-card-700.webp 700w" sizes="(min-width: 64rem) 22rem, 80vw" width="700" height="1360" loading="lazy" decoding="async"
                  alt="The growth-plan card for month 1, week 4: three goals, each with a bar and the words Going well or Needs a push." />
                <figcaption>Three goals, one bar each. <span class="tag tag--plain">sample numbers</span></figcaption>
              </figure>
            </li>
          </ol>
        </div>
      </section>

      <section class="close5 close5--page" aria-labelledby="close-h">
        <div class="wrap close5__in">
          <h2 id="close-h" class="close5__h">See it on your own business.</h2>
          <a class="btn btn-gold btn-lg" href="__CONTACT_URL__">Get a free Brain Snapshot</a>
        </div>
      </section>
    </main>

    <!-- @render footer -->
  </body>
</html>
