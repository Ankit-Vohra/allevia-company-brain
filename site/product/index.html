<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <!-- @head -->
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <!-- @render masthead -->

    <main id="main">
      <section class="page-head" aria-labelledby="h1">
        <div class="wrap page-head__in page-head__in--one">
          <div>
            <h1 id="h1" class="page-head__h">See it&nbsp;working.</h1>
            <p class="lede">Real screens from the app. <span class="tag tag--plain">sample numbers</span></p>
          </div>
        </div>
      </section>

      <section class="section tour" aria-label="Five screens">
        <div class="wrap">
          <ol class="tour__list">
            <li class="tour__item">
              <figure class="shot">
                <img src="/img/tour-office-1600.webp" srcset="/img/tour-office-800.webp 800w, /img/tour-office-1600.webp 1600w" sizes="(min-width: 64rem) 44rem, 100vw" width="1600" height="1000" loading="lazy" decoding="async"
                  alt="The office on a quiet morning: twelve people at desks in coloured zones, dogs and cats on the floor, and on the right this week's headline, what is waiting for your OK and the growth plan." />
                <figcaption>Your team, at their desks.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot">
                <img src="/img/tour-ask-1600.webp" srcset="/img/tour-ask-800.webp 800w, /img/tour-ask-1600.webp 1600w" sizes="(min-width: 64rem) 44rem, 100vw" width="1600" height="1000" loading="lazy" decoding="async"
                  alt="The answer to 'Why we paused daily stories', each claim carrying a small source tag, then a yellow bar that says Waiting for your OK." />
                <figcaption>Ask anything. Every claim shows its source.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot shot--card">
                <img src="/img/tour-approve-1200.webp" srcset="/img/tour-approve-700.webp 700w, /img/tour-approve-1200.webp 1200w" sizes="(min-width: 64rem) 30rem, 100vw" width="1200" height="1042" loading="lazy" decoding="async"
                  alt="An approval card: 'Draft 3 reels: two salary reveals and a day with the screening call', by Tara, with Approve, Edit and Reject buttons." />
                <figcaption>One card: Approve, Edit or Reject. Nothing is posted.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot shot--card">
                <img src="/img/tour-plan-card-700.webp" srcset="/img/tour-plan-card-420.webp 420w, /img/tour-plan-card-700.webp 700w" sizes="(min-width: 64rem) 22rem, 80vw" width="700" height="1360" loading="lazy" decoding="async"
                  alt="The growth-plan card for month 1, week 4: three goals, each with a bar and the words Going well or Needs a push." />
                <figcaption>Three goals, one bar each.</figcaption>
              </figure>
            </li>
            <li class="tour__item">
              <figure class="shot shot--card">
                <img src="/img/tour-team-1200.webp" srcset="/img/tour-team-700.webp 700w, /img/tour-team-1200.webp 1200w" sizes="(min-width: 64rem) 30rem, 100vw" width="1200" height="1262" loading="lazy" decoding="async"
                  alt="The 'Tell your team' box with a typed instruction and example suggestions, above the list of team members with on and off switches." />
                <figcaption>Tell your team what you want, in your own words.</figcaption>
              </figure>
            </li>
          </ol>
        </div>
      </section>

      <section class="close5 close5--page" aria-labelledby="close-h">
        <div class="wrap close5__in">
          <h2 id="close-h" class="close5__h">See it on your own business.</h2>
          <a class="btn btn-gold btn-lg" href="__CONTACT_URL__">Get a free Brain Snapshot</a>
        </div>
      </section>
    </main>

    <!-- @render footer -->
  </body>
</html>
